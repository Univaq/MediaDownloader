[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-downloader-bot"
version = "0.1.0"
description = "Allowlisted Telegram media downloader for supported public Instagram, YouTube and Kick URLs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "MediaDownloader contributors"}]
dependencies = [
  "aiogram>=3.13,<4",
  "yt-dlp>=2025.1.15",
  "python-dotenv>=1.0,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["deploy*"]
